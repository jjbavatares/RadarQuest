.16)}.coord label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:5px}.coord strong{font-size:1.02rem;color:var(--mint)}.radar-wrap{display:grid;place-items:center;margin:14px 0 22px}.radar{width:min(82vw,390px);aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;border:2px solid rgba(95,255,166,.52);background:repeating-radial-gradient(circle,transparent 0 18%,rgba(87,255,157,.16) 18.5% 19%,transparent 19.5% 36%),linear-gradient(rgba(85,255,156,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(85,255,156,.13) 1px,transparent 1px),radial-gradient(circle,#0a281c,#03100b);background-size:auto,50% 100%,100% 50%,auto;box-shadow:0 0 45px rgba(37,235,127,.13),inset 0 0 40px rgba(0,0,0,.65)}.radar:before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 75%,rgba(68,255,151,.07) 84%,rgba(91,255,167,.55) 100%);animation:sweep 3s linear infinite;transform-origin:center}.radar.arrived{animation:pulse .85s ease infinite;border-color:#d4ffe5}.user-dot{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);border-radius:50%;background:var(--green);box-shadow:0 0 0 7px rgba(100,255,174,.14),0 0 20px var(--green)}.target-dot{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--red);box-shadow:0 0 0 7px rgba(255,85,112,.13),0 0 16px var(--red);left:50%;top:16%;transform:translate(-50%,-50%);transition:.35s left,.35s top}.arrow{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-91px 0 0 -36px;transform-origin:36px 91px;transition:transform .18s linear;filter:drop-shadow(0 0 9px rgba(111,255,176,.55))}.arrow:before{content:"";position:absolute;left:23px;top:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:35px solid var(--green)}.arrow:after{content:"";position:absolute;left:31px;top:30px;width:10px;height:38px;border-radius:5px;background:var(--green)}.metri     {id:2,coordenades:{latitude:41.222747,longitude:1.724178},enunciat:"Dos gots idèntics es col·loquen sota el mateix sol de l'estiu. Tots dos contenen exactament la mateixa quantitat d'aigua de l'aixeta a la mateixa temperatura. L'única diferència és que un dels gots és de color blanc brillant i l'altre és de color negre mat. Al cap d'una hora, l'aigua d'un dels gots està notablement més calenta que la de l'altre. Quin got té l'aigua més calenta i per què?",ajuda1:"Pensa en com influeix el color de la roba que ens posem a l'estiu quan anem pel carrer.",ajuda2:"Un dels colors absorbeix gairebé tota la llum del sol que li arriba, mentre que l'altre la reflecteix.",solucio:"L'aigua més calenta és la del got negre, perquè el color negre absorbeix més radiació, llum i calor del Sol.",photoHelp:"Busqueu un monument o font de pedra on es pugui veure l'any “1861”.",referenceImage:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAY9BK4DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD0bFKKKXFegcImKWlAooAQdaMUtFIAopaMUAGKKKXFACdaWiimAUUYpaAEpaKKACloxRSGFHalooASlFFLQITFFLiigYUUvajFACYpRRS0AJ3oFLRQAUUUuKAEFLRiloASilFFACUoFGKWgBKKWimAUUtJikAUUtFABRRRQMO1HSl7UUhCUGlopgJ3paKKACilooAKKXFFAxKUCiigAoxRS0AJ3opaKQBijFLRQAdqKWigBBS0UUgAUUtJTAKKWigBO   function permissionItem(key,name,prepared,denied,unavailable,action,label,note){const status=permissionStatus(key,prepared,denied,unavailable),blocked=permissionUI[key]==='blocked',canRequest=permissionUI[key]!=='prepared'&&permissionUI[key]!=='unavailable';return `<div class="permission-item"><div class="permission-head"><div class="permission-name">${name}</div><div class="permission-state ${status.className}">${status.text}</div></div>${note?`<p class="permission-note">${note}</p>`:''}${canRequest?`<button class="btn secondary" data-action="${action}" ${permissionUI.checking?'disabled':''}>${label}</button>`:''}${blocked?`<div class="permission-blocked"><strong>El navegador té aquest permís bloquejat.</strong><br>Obriu la configuració o els permisos d’aquest lloc i activeu-lo manualment.<br>${devicePermissionHelp()}</div>`:''}</div>`}

  function setupView(){const ready=permissionUI.camera==='prepared'&&permissionUI.gps==='prepared';const cameraNote=permissionUI.cameraMessage||'Necessària per escanejar codis QR i fotografiar els elements.';const gpsNote=permissionUI.gpsMessage||(permissionUI.gpsAccuracy!==null?`Precisió aproximada: ±${Math.round(permissionUI.gpsAccuracy)} m`:'Necessària per calcular la distància fins a l’objectiu.');const orientationNote=permissionUI.orientationMessage||'Recomanable per orientar la fletxa del radar.';return `<p class="eyebrow">ACTIVACIÓ DEL DISPOSITIU</p><h1>PREPAREM L'EQUIP</h1><p>Activeu cada servei amb el seu botó. La càmera i el GPS són imprescindibles per continuar.</p>${!window.isSecureContext?'<div class="secure-warning">RadarQuest necessita una connexió segura HTTPS per utilitzar la càmera i el GPS.</div>':''}<div class="card"><div class="permission-grid">${permissionItem('camera','CÀMERA','Càmera preparada','Accés a la càmera denegat','Càmera no disponible','activateCamera','ACTIVAR CÀMERA',cameraNote)}${permissionItem('gps','UBICACIÓ GPS','GPS preparat','Accés a la ubicació denegat','GPS no disponible','activateGPS','ACTIVAR UBICACIÓ',gpsNote)}${permissionItem('orientation','BRÚIXOLA','Brúixola preparada','Accés a l’orientació denegat','Brúixola no disponible','activateCompass','ACTIVAR BRÚIXOLA',orientationNote)}${permissionItem('sound','SO','So preparat','So denegat','So no disponible','activateSound','ACTIVAR SO','El so s’activa amb la vostra interacció.')} ${permissionItem('vibration','VIBRACIÓ','Vibració preparada','Vibració denegada','Vibració no disponible','activateVibration','ACTIVAR VIBRACIÓ','La vibració és opcional i no està disponible en tots els dispositius.')}</div>${ready?'<div class="team-ready">✓ EQUIP PREPARAT</div>':''}<div class="actions"><button class="btn" data-action="continueSetup" ${ready?'':'disabled'}>CONTINUAR</button><button class="btn secondary" data-action="recheckPermissions">TORNAR-HO A COMPROVAR</button></div>${diagnost   async function action(name){if(name==='reset'){if(confirm('Segur que voleu començar una partida nova? Es perdrà el progrés actual.')){cleanup();localStorage.removeItem(STORE);state=initialState();render()}return}if(name==='start'){unlockAudio();permissionUI.sound=audioCtx?'prepared':'unavailable';state.permissions.audio=permissionUI.sound==='prepared';permissionUI.inspected=false;setState({screen:'setup'},false);render();return}if(name==='activateCamera'){await requestCameraPermission();return}if(name==='activateGPS'){await requestGPSPermission();return}if(name==='activateCompass'){await requestCompassPermission();return}if(name==='activateSound'){unlockAudio();permissionUI.sound=audioCtx?'prepared':'unavailable';state.permissions.audio=permissionUI.sound==='prepared';save();render();return}if(name==='activateVibration'){permissionUI.vibration='vibrate'in navigator?'prepared':'unavailable';state.permissions.vibration=permissionUI.vibration==='prepared';save();render();return}if(name==='recheckPermissions'){await inspectPermissions();return}if(name==='continueSetup'){if(permissionUI.camera==='prepared'&&permissionUI.gps==='prepared')setState({screen:'scanner'});return}if(name==='manualQR'){processQR(document.getElementById('manualCoord')?.value||'');return}if(name==='goRadar'){setState({screen:'radar',arrivalTriggered:false});return}if(name==='openCamera'||name==='retake'){captureURL=null;setState({screen:'camera'});return}if(name==='capture'){capturePhoto();return}if(name==='usePhoto'){validatePhoto();return}if(name==='openRiddle'){setState({screen:'riddle',questionLevel:0,questionAttempts:0});return}if(name==='checkAnswer'){checkAnswer();return}if(name==='nextQR'){if(state.completedTests.length===PROVES.length)setState({screen:'allDone',activeTestId:null});else setState({screen:'scanner',activeTestId:null,photoFailures:0,questionLevel:0,questionAttempts:0,arrivalTriggered:false});return}if(name==='lastFragment'){sound('final');vibrate([120,70,120,70,500,100,700])   async function afterRender(){if(state.screen==='setup'&&!permissionUI.inspected){permissionUI.inspected=true;inspectPermissions()}if(state.screen==='scanner')startScanner();if(state.screen==='radar')startRadar();if(state.screen==='camera')startCamera();if(state.screen==='photoWait'||state.screen==='questionWait')startCountdown();if(state.screen==='celebration')sound('final')}

  async function requestCameraPermission(){if(!window.isSecureContext){permissionUI.camera='unavailable';permissionUI.cameraMessage='RadarQuest necessita una connexió segura HTTPS per utilitzar la càmera.';syncPermissionState();render();return}permissionUI.checking=true;permissionUI.cameraMessage='Sol·licitant accés a la càmera…';render();try{const checkStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});checkStream.getTracks().forEach(track=>track.stop());permissionUI.camera='prepared';permissionUI.cameraMessage='La càmera s’ha comprovat i s’ha tancat correctament.'}catch(error){const p=await queryPermissionState('camera');permissionUI.camera=p==='denied'?'blocked':error?.name==='NotAllowedError'?'denied':'unavailable';permissionUI.cameraMessage=permissionUI.camera==='unavailable'?'No s’ha pogut accedir a cap càmera compatible.':'Cal activar el permís de càmera del navegador per poder continuar.'}permissionUI.checking=false;syncPermissionState();render()}

  async function requestCompassPermission(){if(!('DeviceOrientationEvent'in window)){permissionUI.orientation='unavailable';permissionUI.orientationMessage='Aquest dispositiu no ofereix orientació compatible.';syncPermissionState();render();return}permissionUI.checking=true;permissionUI.orientationMessage='Comprovant dades reals d’orientació…';render();try{if(typeof DeviceOrientationEvent.requestPermission==='function'){const result=await DeviceOrientationEvent.requestPermission();if(result!=='granted'){permissionUI.orientation='denied';permissionUI.orientationMessage='Accés a l’orientació denegat.'}else{const received=await waitForOrientationData();permissionUI.orientation=received?'prepared':'unavailable';permissionUI.orientationMessage=received?'S’han rebut dades reals d’orientació.':'No s’han rebut dades d’orientació del dispositiu.'}}else{const received=await waitForOrientationData();permissionUI.orientation=received?'prepared':'unavailable';permissionUI.orientationMessage=received?'S’han rebut dades reals d’orientació.':'No s’han rebut dades d’orientació del dispositiu.'}}catch{permissionUI.orientation='denied';permissionUI.orientationMessage='Accés a l’orientació denegat.'}permissionUI.checking=false;syncPermissionState();render()}
  function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{audioCtx=null}}
  function sound(type){unlockAudio();if(!audioCtx)return;const map={qr:[[880,.07],[1320,.1]],arrival:[[440,.18],[660,.18],[990,.45]],photoOk:[[620,.12],[920,.25]],photoBad:[[180,.2],[130,.25]],answerOk:[[700,.1],[1000,.18]],answerBad:[[210,.14],[160,.22]],victory:[[523,.14],[659,.14],[784,.16],[1047,.5]],final:[[392,.16],[523,.16],[659,.16],[784,.2],[1047,.6]],ambient:[[523,.25],[659,.25],[784,.5]]};let t=audioCtx.currentTime;(map[type]||map.qr).forEach(([f,d])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type.includes('Bad')?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+d+.03);t+=d*.72})}
  function vibrate(pattern){try{navigator.vibrate?.(pattern)}catch{}}
  async function startCamera(){const msg=document.getElementById('cameraMessage');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});const v=document.getElementById('video');v.srcObject=stream;await v.play()}catch{if(msg)msg.innerHTML='<div class="toast error">No podem obrir la càmera. Comproveu els permisos i tanqueu altres aplicacions que la puguin estar utilitzant.</div>'}}
  async function startScanner(){await startCamera();const video=document.getElementById('video');if(!video||!stream)return;try{if('BarcodeDetector'in window){const formats=await BarcodeDetector.getSupportedFormats();if(formats.includes('qr_code'))barcodeDetector=new BarcodeDetector({formats:['qr_code']})}}catch{barcodeDetector=null}scanLoop()}
  async function scanLoop(){const video=document.getElementById('video');if(!video||state.screen!=='scanner'||video.readyState<2){scanTimer=setTimeout(scanLoop,180);return}try{let raw=null;if(barcodeDetector){const codes=await barcodeDetector.detect(video);raw=codes[0]?.rawValue||null}else if(typeof jsQR==='function'){const w=Math.min(720,video.videoWidth),h=Math.round(w*video.videoHeight/video.videoWidth);canvas.width=w;canvas.height=h;const c=canvas.getContext('2d',{willReadFrequently:true});c.drawImage(video,0,0,w,h);const d=c.getImageData(0,0,w,h);raw=jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'})?.data||null}if(raw){stopMedia();sound('qr');vibrate(90);processQR(raw);return}}catch{}scanTimer=setTimeout(scanLoop,180)}
  function parseCoordinates(text){const clean=String(text).trim().replace(/[\r\n;]+/g,' ').replace(/\s+/g,' ');const m=clean.match(/^\s*([+-]?\d{1,2}(?:\.\d+)?)\s*(?:,|\s)\s*([+-]?\d{1,3}(?:\.\d+)?)\s*$/);if(!m)return null;const lat=Number(m[1]),lon=Number(m[2]);if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180)return null;return{latitude:lat,longitude:lon}}
  function processQR(raw){const c=parseCoordinates(raw);if(!c){setState({screen:'error',errorMessage:'Aquest codi no conté unes coordenades vàlides.'});return}const p=PROVES.find(x=>Math.abs(x.coordenades.latitude-c.latitude)<=CONFIG.COORDINATE_TOLERANCE&&Math.abs(x.coordenades.longitude-c.longitude)<=CONFIG.COORDINATE_TOLERANCE);if(!p){setState({screen:'error',errorMessage:'Aquest codi no correspon a cap prova del joc.'});return}if(state.completedTests.includes(p.id)){setState({screen:'repeated',activeTestId:null});return}setState({screen:'coords',activeTestId:p.id,photoFailures:0,questionLevel:0,questionAttempts:0,arrivalTriggered:false})}
  function startRadar(){const p=activeTest();if(!p||!navigator.geolocation){setState({screen:'error',errorMessage:'El GPS no està disponible en aquest dispositiu.'});return}const orientation=e=>{let h=e.webkitCompassHeading;if(!Number.isFinite(h)){const angle=e.alpha;if(Number.isFinite(angle))h=360-angle}if(Number.isFinite(h)){heading=(h+360)%360;updateRadar(lastPosition)}};window.addEventListener('deviceorientationabsolute',orientation,{passive:true});window.addEventListener('deviceorientation',orientation,{passive:true});watchId=navigator.geolocation.watchPosition(pos=>{lastPosition=pos;updateRadar(pos)},err=>{const m=document.getElementById('radarMessage');if(m)m.className='toast error',m.textContent=err.code===1?'No tenim permís per utilitzar el GPS.':'S’ha perdut el senyal GPS. Manteniu-vos en un espai obert.'},{enableHighAccuracy:true,maximumAge:1000,timeout:12000})}
  function haversine(a,b){const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(b.latitude-a.latitude),dLon=rad(b.longitude-a.longitude),la1=rad(a.latitude),la2=rad(b.latitude);const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
  function bearing(a,b){const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI,dLon=rad(b.longitude-a.longitude),y=Math.sin(dLon)*Math.cos(rad(b.latitude)),x=Math.cos(rad(a.latitude))*Math.sin(rad(b.latitude))-Math.sin(rad(a.latitude))*Math.cos(rad(b.latitude))*Math.cos(dLon);return(deg(Math.atan2(y,x))+360)%360}
  function updateRadar(pos){if(!pos||state.screen!=='radar')return;const target=activeTest().coordenades,here={latitude:pos.coords.latitude,longitude:pos.coords.longitude},d=haversine(here,target),b=bearing(here,target),relative=(b-heading+360)%360;const dist=document.getElementById('distance'),acc=document.getElementById('accuracy'),arrow=document.getElementById('arrow'),dot=document.getElementById('targetDot'),msg=document.getElementById('radarMessage');if(dist)dist.textContent=d<1000?`${Math.round(d)} m`:`${(d/1000).toFixed(2)} km`;if(acc)acc.textContent=`±${Math.round(pos.coords.accuracy)} m`;if(arrow)arrow.style.transform=`rotate(${relative}deg)`;const maxRange=Math.max(25,Math.min(300,d*1.2)),radius=Math.min(.43,d/maxRange*.43),angle=(relative-90)*Math.PI/180;if(dot){dot.style.left=`${50+Math.cos(angle)*radius*100}%`;dot.style.top=`${50+Math.sin(angle)*radius*100}%`}if(msg){msg.className=pos.coords.accuracy>35?'toast error':'toast info';msg.textContent=pos.coords.accuracy>35?'La precisió és baixa. Espereu uns segons en un espai obert.':'Senyals actualitzats en temps real.'}if(d<=CONFIG.ARRIVAL_RADIUS_METERS&&!state.arrivalTriggered){state.arrivalTriggered=true;save();sound('arrival');vibrate([300,100,300,100,500]);setTimeout(()=>setState({screen:'arrival'}),250)}}
  function capturePhoto(){const video=document.getElementById('video');if(!video||!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);captureURL=canvas.toDataURL('image/jpeg',.88);stopMedia();setState({screen:'preview'})}
  async function validatePhoto(){if(!captureURL)return;app.querySelector('[data-action="usePhoto"]')?.setAttribute('disabled','');try{const score=await compareImages(captureURL,activeTest().referenceImage);captureURL=null;if(score>=CONFIG.PHOTO_SIMILARITY_THRESHOLD){sound('photoOk');vibrate([100,80,100,80,400]);setState({screen:'photoCorrect',questionLevel:0,questionAttempts:0,photoFailures:state.photoFailures})}else{sound('photoBad');vibrate([200,100,200]);const failures=state.photoFailures+1;if(failures>=CONFIG.PHOTO_INITIAL_ATTEMPTS){setState({screen:'photoWait',photoFailures:failures,waitEnd:Date.now()+CONFIG.PHOTO_HELP_WAIT_SECONDS*1000,phaseAfterWait:'photoHelp'})}else{setState({screen:'camera',photoFailures:failures});setTimeout(()=>{const m=document.getElementById('cameraMessage');if(m)m.innerHTML=`<div class="toast error"><strong>FOTOGRAFIA INCORRECTA</strong><br>Aquest no sembla ser l'element que busquem. Torneu-ho a intentar. Queden ${CONFIG.PHOTO_INITIAL_ATTEMPTS-failures} intents abans de la pista.</div>`},50)}}}catch{captureURL=null;setState({screen:'camera'});setTimeout(()=>{const m=document.getElementById('cameraMessage');if(m)m.innerHTML='<div class="toast error">No hem pogut processar la fotografia. Torneu-la a fer.</div>'},50)}}
  function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
  async function compareImages(aSrc,bSrc){const[a,b]=await Promise.all([loadImage(aSrc),loadImage(bSrc)]);const variants=featureVariants(a),ref=featureVariants(b)[0];let best=0;for(const v of variants)best=Math.max(best,featureScore(v,ref));return best}
  function featureVariants(img){const crops=[1,.86,.72],rots=img.height>img.width?[0,Math.PI/2,-Math.PI/2]:[0];const out=[];for(const crop of crops)for(const rot of rots)out.push(extractFeatures(img,crop,rot));return out}
  function extractFeatures(img,crop,rot){const size=64,cv=document.createElement('canvas');cv.width=cv.height=size;const c=cv.getContext('2d',{willReadFrequently:true});c.fillStyle='#777';c.fillRect(0,0,size,size);c.save();c.translate(size/2,size/2);c.rotate(rot);const s=Math.min(img.width,img.height)*crop,sx=(img.width-s)/2,sy=(img.height-s)/2;c.drawImage(img,sx,sy,s,s,-size/2,-size/2,size,size);c.restore();const d=c.getImageData(0,0,size,size).data,gray=new Float32Array(size*size),color=new Float32Array(36),edge=new Float32Array(16*8);let mean=0;for(let i=0,p=0;i<d.length;i+=4,p++){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;gray[p]=.299*r+.587*g+.114*b;mean+=gray[p];const max=Math.max(r,g,b),min=Math.min(r,g,b),delta=max-min;let h=0;if(delta){if(max===r)h=((g-b)/delta+6)%6;else if(max===g)h=(b-r)/delta+2;else h=(r-g)/delta+4}const sat=max?delta/max:0;color[Math.min(11,Math.floor(h*2))]++;color[12+Math.min(11,Math.floor(sat*12))]++;color[24+Math.min(11,Math.floor(max*12))]++}mean/=gray.length;let variance=0;for(let i=0;i<gray.length;i++)variance+=(gray[i]-mean)**2;const sd=Math.sqrt(variance/gray.length)||1;for(let i=0;i<gray.length;i++)gray[i]=(gray[i]-mean)/sd;for(let y=1;y<size-1;y++)for(let x=1;x<size-1;x++){const p=y*size+x,gx=gray[p+1]-gray[p-1],gy=gray[p+size]-gray[p-size],mag=Math.hypot(gx,gy);if(mag>.08){const ang=(Math.atan2(gy,gx)+Math.PI)%(Math.PI),bin=Math.min(7,Math.floor(ang/Math.PI*8)),cell=Math.floor(y/16)*4+Math.floor(x/16);edge[cell*8+bin]+=mag}}normalize(color);normalize(edge);return{gray,color,edge}}
  function normalize(v){let n=0;for(const x of v)n+=x*x;n=Math.sqrt(n)||1;for(let i=0;i<v.length;i++)v[i]/=n}
  function cosine(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return Math.max(0,Math.min(1,s))}
  function grayCorrelation(a,b){let s=0,aa=0,bb=0;for(let i=0;i<a.length;i++){s+=a[i]*b[i];aa+=a[i]*a[i];bb+=b[i]*b[i]}return Math.max(0,(s/Math.sqrt(aa*bb)+1)/2)}
  function featureScore(a,b){return .42*grayCorrelation(a.gray,b.gray)+.38*cosine(a.edge,b.edge)+.20*cosine(a.color,b.color)}
  function normalizeText(s){return String(s).toLocaleLowerCase('ca').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
  function checkAnswer(){const input=document.getElementById('answer'),msg=document.getElementById('answerMessage');const text=normalizeText(input?.value||'');if(!text){msg.innerHTML='<div class="toast error">Escriviu una resposta abans de validar-la.</div>';return}const ok=activeTest().acceptedConcepts.every(group=>group.some(term=>text.includes(normalizeText(term))));if(ok){sound('answerOk');vibrate([100,80,100,80,400]);const completed=[...new Set([...state.completedTests,activeTest().id])];state.completedTests=completed;state.questionAttempts=0;save();sound('victory');setState({screen:'completed'})}else{sound('answerBad');vibrate([200,100,200]);const attempts=state.questionAttempts+1;if(attempts<CONFIG.QUESTION_ATTEMPTS_PER_LEVEL){setState({questionAttempts:attempts},false);msg.innerHTML=`<div class="toast error"><strong>ERROR</strong><br>La resposta no és correcta. Torneu-ho a intentar.</div>`;app.querySelector('.attempt').textContent=`Intent ${attempts+1} de ${CONFIG.QUESTION_ATTEMPTS_PER_LEVEL}`;input.value=''}else{const nextLevel=Math.min(3,state.questionLevel+1),phase=nextLevel===1?'help1':nextLevel===2?'help2':'solution';setState({screen:'questionWait',questionAttempts:0,waitEnd:Date.now()+CONFIG.QUESTION_HELP_WAIT_SECONDS*1000,phaseAfterWait:phase,questionLevel:nextLevel})}}}
  function startCountdown(){const tick=()=>{const left=Math.max(0,Math.ceil(((state.waitEnd||Date.now())-Date.now())/1000)),el=document.getElementById('countdown');if(el)el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(countdownTimer);countdownTimer=null;if(state.phaseAfterWait==='photoHelp')setState({screen:'photoHelp',waitEnd:null});else setState({screen:'riddle',waitEnd:null})}};tick();countdownTimer=setInterval(tick,250)}
  try{validateConfig();render()}catch(e){console.error(e);state={...initialState(),screen:'error',errorMessage:'La configuració interna del joc conté dades duplicades. Aviseu la persona responsable.'};render()}
